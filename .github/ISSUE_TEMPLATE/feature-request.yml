name: Предложение функции
description: Предложить полезное улучшение Focus Browser
labels: ["enhancement"]
title: "[Предложение] "
body:
  - type: markdown
    attributes:
      value: Сначала проверьте, нет ли такого предложения в существующих Issues.
  - type: textarea
    id: problem
    attributes:
      label: Проблема
      description: Какую пользовательскую проблему должно решить изменение?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
      description: Опишите минимально полезное поведение и компромиссы.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Рассмотренные варианты
  - type: checkboxes
    id: contribution
    attributes:
      label: Участие
      options:
        - label: Я готов помочь с реализацией или тестированием этой функции.
