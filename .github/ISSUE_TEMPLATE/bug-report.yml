name: Bug report
description: Report a reproducible Focus Browser problem
labels: ["bug"]
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not attach a real browser profile,
        cookies, passwords, tokens or other private data. Report security
        vulnerabilities through the private process described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Focus Browser version
      description: Copy the version from focus://settings/help.
      placeholder: "1.0.0.0"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation type
      options:
        - Installer
        - Portable archive
        - Local source build
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and its user impact.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Additional diagnostics
      description: Add sanitized logs or screenshots and mention whether a disposable profile reproduces the issue.
