name: Сообщение об ошибке
description: Сообщить о воспроизводимой проблеме Focus Browser
labels: ["bug"]
title: "[Ошибка] "
body:
  - type: markdown
    attributes:
      value: |
        Сначала проверьте существующие Issues. Не прикладывайте настоящий
        профиль, cookies, пароли, токены и другие личные данные. Для уязвимостей
        используйте порядок из SECURITY.md и не публикуйте технические детали.
  - type: input
    id: version
    attributes:
      label: Версия Focus Browser
      description: Скопируйте версию со страницы focus://settings/help.
      placeholder: "1.0.4.0"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Способ установки
      options:
        - Установщик
        - Портативный архив
        - Локальная сборка исходников
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Что произошло?
      description: Опишите проблему и её влияние на работу.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Откройте ...
        2. Выберите ...
        3. Наблюдайте ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Дополнительная диагностика
      description: Приложите обезличенные журналы или снимки и укажите, воспроизводится ли проблема в одноразовом профиле.
