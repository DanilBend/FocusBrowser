name: Проверка исходников

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Validate Focus 1.0 release configuration
      run: |
        python build_support/test_release_configuration.py
        python -m unittest discover -s .github/scripts -p 'test_*.py'
        node .github/actions/stage/release-version.test.js
    - run: python focus-chromium/devutils/lint.py -t .

  macos-release-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Validate macOS release helpers
      run: |
        python -m unittest discover -s platform/macos/tests -p 'test_*.py'
