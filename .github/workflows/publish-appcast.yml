name: Publish WinSparkle appcast

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag
        required: true
        default: v1.0.5
      version:
        description: Four-part Focus Browser version
        required: true
        default: 1.0.5.0
      short_version:
        description: User-facing Focus Browser version
        required: true
        default: 1.0.5
      asset_name:
        description: Final x64 mini-installer asset
        required: true
        default: FocusBrowser_1.0.5_x64-mini-installer.exe

permissions:
  contents: read

concurrency:
  group: focus-update-appcasts-pages
  cancel-in-progress: false

jobs:
  verify-appcast:
    name: Verify immutable x64 release and appcast
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      FOCUS_VERSION: ${{ inputs.version }}
      FOCUS_SHORT_VERSION: ${{ inputs.short_version }}
      ASSET_NAME: ${{ inputs.asset_name }}
      FULL_INSTALLER_NAME: FocusBrowser_${{ inputs.short_version }}_x64-installer.exe
      PORTABLE_ZIP_NAME: FocusBrowser_${{ inputs.short_version }}_x64-windows.zip
      CHECKSUMS_NAME: SHA256SUMS-${{ inputs.short_version }}.txt
      APPCAST_NAME: appcast-x64.xml
      WINSPARKLE_ED_KEY: ${{ vars.WINSPARKLE_ED_KEY }}
      PRODUCTION_APPCAST_URL: https://danilbend.github.io/FocusBrowser/appcast-x64.xml
      PRODUCTION_MACOS_APPCAST_URL: https://danilbend.github.io/FocusBrowser/appcast-macos.xml
    steps:
      - name: Reject dispatches outside main
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          throw "This publication workflow must be dispatched from main"

      - name: Check out Pages handoff gate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate release inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?$') {
            throw "Invalid release tag"
          }
          if ($env:FOCUS_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid four-part version"
          }
          if ($env:FOCUS_SHORT_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid short version"
          }
          if ($env:RELEASE_TAG -cne "v$($env:FOCUS_SHORT_VERSION)") {
            throw "Release tag and short version do not match"
          }
          if ($env:FOCUS_VERSION -cne "$($env:FOCUS_SHORT_VERSION).0") {
            throw "Production x64 releases require a zero platform revision"
          }
          $expectedAsset = "FocusBrowser_$($env:FOCUS_SHORT_VERSION)_x64-mini-installer.exe"
          if ($env:ASSET_NAME -cne $expectedAsset) {
            throw "Asset name must be exactly $expectedAsset"
          }
          if ($env:WINSPARKLE_ED_KEY -notmatch '^[A-Za-z0-9+/]{43}=$') {
            throw "WINSPARKLE_ED_KEY is missing or malformed"
          }

          $release = gh api -H 'X-GitHub-Api-Version: 2026-03-10' `
            "repos/$($env:GITHUB_REPOSITORY)/releases/tags/$($env:RELEASE_TAG)" |
            ConvertFrom-Json
          if ($release.draft -or $release.prerelease -or $null -eq $release.published_at) {
            throw "The production appcast requires a published stable release"
          }
          if ([string]$release.tag_name -cne $env:RELEASE_TAG) {
            throw "GitHub release tag does not match the requested tag"
          }
          if ($release.immutable -ne $true) {
            throw "The production appcast requires an immutable GitHub release"
          }

          $expectedAssets = @(
            $env:FULL_INSTALLER_NAME,
            $env:ASSET_NAME,
            $env:PORTABLE_ZIP_NAME,
            $env:CHECKSUMS_NAME,
            $env:APPCAST_NAME
          )
          if (@($release.assets).Count -ne $expectedAssets.Count) {
            throw "The release must contain exactly five production x64 assets"
          }
          foreach ($expectedName in $expectedAssets) {
            $matches = @($release.assets |
              Where-Object name -CEQ $expectedName)
            if ($matches.Count -ne 1) {
              throw "The release must contain exactly one $expectedName asset"
            }
            if ([string]$matches[0].state -cne 'uploaded' -or
                [int64]$matches[0].size -le 0 -or
                [string]$matches[0].digest -cnotmatch '^sha256:[0-9a-f]{64}$') {
              throw "Release asset metadata is incomplete for $expectedName"
            }
          }

          $mainRef = gh api -H 'X-GitHub-Api-Version: 2026-03-10' `
            "repos/$($env:GITHUB_REPOSITORY)/git/ref/heads/main" |
            ConvertFrom-Json
          if ([string]$mainRef.object.type -cne 'commit' -or
              [string]$mainRef.object.sha -cne $env:GITHUB_SHA) {
            throw "The workflow must run from the current main commit"
          }

          $tagRef = gh api -H 'X-GitHub-Api-Version: 2026-03-10' `
            "repos/$($env:GITHUB_REPOSITORY)/git/ref/tags/$($env:RELEASE_TAG)" |
            ConvertFrom-Json
          $tagObjectType = [string]$tagRef.object.type
          $tagObjectSha = [string]$tagRef.object.sha
          $peelDepth = 0
          while ($tagObjectType -ceq 'tag') {
            $peelDepth += 1
            if ($peelDepth -gt 8) {
              throw "The release tag contains too many nested annotated tags"
            }
            $tagObject = gh api -H 'X-GitHub-Api-Version: 2026-03-10' `
              "repos/$($env:GITHUB_REPOSITORY)/git/tags/$tagObjectSha" |
              ConvertFrom-Json
            $tagObjectType = [string]$tagObject.object.type
            $tagObjectSha = [string]$tagObject.object.sha
          }
          if ($tagObjectType -cne 'commit') {
            throw "The release tag must ultimately resolve to a commit"
          }
          $comparison = gh api -H 'X-GitHub-Api-Version: 2026-03-10' `
            "repos/$($env:GITHUB_REPOSITORY)/compare/$tagObjectSha...$($mainRef.object.sha)" |
            ConvertFrom-Json
          if ([string]$comparison.merge_base_commit.sha -cne $tagObjectSha -or
              [string]$comparison.status -notin @('ahead', 'identical')) {
            throw "The release tag must resolve to a commit on current main history"
          }

      - name: Download and validate immutable release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payloadDir = Join-Path $env:RUNNER_TEMP 'focus-update-payload'
          New-Item -ItemType Directory -Path $payloadDir -Force | Out-Null

          $release = gh api -H 'X-GitHub-Api-Version: 2026-03-10' `
            "repos/$($env:GITHUB_REPOSITORY)/releases/tags/$($env:RELEASE_TAG)" |
            ConvertFrom-Json

          $assetNames = @(
            $env:FULL_INSTALLER_NAME,
            $env:ASSET_NAME,
            $env:PORTABLE_ZIP_NAME,
            $env:CHECKSUMS_NAME,
            $env:APPCAST_NAME
          )
          $downloaded = @{}
          foreach ($assetName in $assetNames) {
            $assets = @($release.assets |
              Where-Object name -CEQ $assetName)
            if ($assets.Count -ne 1) {
              throw "Release asset inventory changed for $assetName"
            }
            $destination = Join-Path $payloadDir $assetName
            Invoke-WebRequest -UseBasicParsing `
              -Uri $assets[0].browser_download_url `
              -OutFile $destination
            if (-not (Test-Path -LiteralPath $destination -PathType Leaf)) {
              throw "Public release asset download failed for $assetName"
            }
            $length = (Get-Item -LiteralPath $destination).Length
            $digest = 'sha256:' +
              (Get-FileHash -Algorithm SHA256 `
                -LiteralPath $destination).Hash.ToLowerInvariant()
            if ($length -ne [int64]$assets[0].size -or
                $digest -cne [string]$assets[0].digest) {
              throw "Downloaded asset metadata mismatch for $assetName"
            }
            $downloaded[$assetName] = $destination
          }

          foreach ($largeAssetName in @(
            $env:FULL_INSTALLER_NAME,
            $env:ASSET_NAME,
            $env:PORTABLE_ZIP_NAME
          )) {
            if ((Get-Item -LiteralPath $downloaded[$largeAssetName]).Length -lt 1MB) {
              throw "Downloaded binary asset is unexpectedly small: $largeAssetName"
            }
          }

          function Assert-PeMachine(
              [string]$Path,
              [string]$Label,
              [uint16]$ExpectedMachine) {
            $stream = [IO.File]::OpenRead($Path)
            try {
              $reader = [IO.BinaryReader]::new($stream)
              if ($reader.ReadUInt16() -ne 0x5A4D) {
                throw "$Label is not a PE file"
              }
              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              if ($peOffset -lt 0x40 -or $peOffset -gt ($stream.Length - 6)) {
                throw "$Label has an invalid PE header offset"
              }
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) {
                throw "$Label has an invalid PE signature"
              }
              $machine = $reader.ReadUInt16()
              if ($machine -ne $ExpectedMachine) {
                $actual = '0x{0:X4}' -f $machine
                $expected = '0x{0:X4}' -f $ExpectedMachine
                throw "$Label has PE machine $actual; expected $expected"
              }
            } finally {
              $stream.Dispose()
            }
          }
          # The full launcher is intentionally x86 so it can bootstrap the x64
          # payload broadly; the native mini-installer itself must remain x64.
          Assert-PeMachine `
            $downloaded[$env:FULL_INSTALLER_NAME] 'Full installer' 0x014C
          Assert-PeMachine `
            $downloaded[$env:ASSET_NAME] 'Mini-installer' 0x8664

          $checksumsPath = $downloaded[$env:CHECKSUMS_NAME]
          $checksumLines = @(Get-Content -LiteralPath $checksumsPath `
            -Encoding utf8 | Where-Object { $_ -ne '' })
          $checksummedNames = @(
            $env:FULL_INSTALLER_NAME,
            $env:ASSET_NAME,
            $env:PORTABLE_ZIP_NAME,
            $env:APPCAST_NAME
          )
          if ($checksumLines.Count -ne $checksummedNames.Count) {
            throw "The checksum file must contain exactly four non-empty lines"
          }
          $checksums = @{}
          foreach ($line in $checksumLines) {
            if ($line -cnotmatch '^([0-9a-f]{64})  ([^/\\]+)$') {
              throw "Malformed SHA256SUMS line: $line"
            }
            $hash = $Matches[1]
            $name = $Matches[2]
            if ($checksums.ContainsKey($name)) {
              throw "Duplicate SHA256SUMS entry: $name"
            }
            $checksums[$name] = $hash
          }
          if ($checksums.Count -ne $checksummedNames.Count) {
            throw "The checksum file contains an unexpected asset inventory"
          }
          foreach ($checksummedName in $checksummedNames) {
            if (-not $checksums.ContainsKey($checksummedName)) {
              throw "SHA256SUMS is missing $checksummedName"
            }
            $actualHash = (Get-FileHash -Algorithm SHA256 `
              -LiteralPath $downloaded[$checksummedName]).Hash.ToLowerInvariant()
            if ([string]$checksums[$checksummedName] -cne $actualHash) {
              throw "SHA256SUMS mismatch for $checksummedName"
            }
          }

          "FOCUS_FULL_INSTALLER=$($downloaded[$env:FULL_INSTALLER_NAME])" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FOCUS_UPDATE_PAYLOAD=$($downloaded[$env:ASSET_NAME])" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FOCUS_PORTABLE_ZIP=$($downloaded[$env:PORTABLE_ZIP_NAME])" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FOCUS_UPDATE_SUMS=$checksumsPath" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FOCUS_UPDATE_APPCAST=$($downloaded[$env:APPCAST_NAME])" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Acquire pinned WinSparkle signing tool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolVersion = '0.9.3'
          $toolUrl = "https://github.com/vslavik/winsparkle/releases/download/v$toolVersion/WinSparkle-$toolVersion.zip"
          $expectedSha256 = '745985f41d2ab26b2d5a1cf87d76e4ed851039db19038e50610eb25ea0b73772'
          $toolRoot = Join-Path $env:RUNNER_TEMP "winsparkle-tool-$toolVersion"
          $toolZip = Join-Path $toolRoot "WinSparkle-$toolVersion.zip"
          New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri $toolUrl -OutFile $toolZip
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $toolZip).Hash.ToLowerInvariant()
          if ($actualSha256 -cne $expectedSha256) {
            throw "WinSparkle tool archive SHA-256 mismatch"
          }
          Expand-Archive -LiteralPath $toolZip -DestinationPath $toolRoot -Force
          $tool = Join-Path $toolRoot "WinSparkle-$toolVersion\bin\winsparkle-tool.exe"
          $reportedVersion = ((& $tool --version) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $reportedVersion -cne $toolVersion) {
            throw "Unexpected winsparkle-tool version"
          }
          "WINSPARKLE_TOOL=$tool" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate appcast and verify Ed25519 signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $siteRoot = Join-Path $env:RUNNER_TEMP 'focus-pages'
          New-Item -ItemType Directory -Path $siteRoot -Force | Out-Null

          function Read-SafeXml([string]$Path) {
            $settings = [Xml.XmlReaderSettings]::new()
            $settings.DtdProcessing = [Xml.DtdProcessing]::Prohibit
            $settings.XmlResolver = $null
            $reader = [Xml.XmlReader]::Create($Path, $settings)
            try {
              $document = [Xml.XmlDocument]::new()
              $document.XmlResolver = $null
              $document.Load($reader)
              return $document
            } finally {
              $reader.Dispose()
            }
          }

          $document = Read-SafeXml $env:FOCUS_UPDATE_APPCAST
          $channels = @($document.SelectNodes('/rss/channel'))
          $items = @($document.SelectNodes('/rss/channel/item'))
          $enclosures = @($document.SelectNodes('/rss/channel/item/enclosure'))
          if ($channels.Count -ne 1 -or $items.Count -ne 1) {
            throw "Appcast must contain exactly one channel and one item"
          }
          if ($enclosures.Count -ne 1) {
            throw "Appcast must contain exactly one enclosure"
          }
          $channel = $channels[0]
          $item = $items[0]
          $enclosure = $enclosures[0]
          $sparkleNamespace = 'http://www.andymatuschak.org/xml-namespaces/sparkle'
          $release = gh api -H 'X-GitHub-Api-Version: 2026-03-10' `
            "repos/$($env:GITHUB_REPOSITORY)/releases/tags/$($env:RELEASE_TAG)" |
            ConvertFrom-Json

          function Get-SingleChildText(
            [System.Xml.XmlNode]$Parent,
            [string]$Name
          ) {
            $nodes = @($Parent.SelectNodes("./$Name"))
            if ($nodes.Count -ne 1) {
              throw "Appcast must contain exactly one $Name child"
            }
            return [string]$nodes[0].InnerText
          }

          $releaseUrl = [string]$release.html_url
          if ((Get-SingleChildText $channel 'title') -cne
              'Focus Browser updates (x64)') {
            throw "Unexpected appcast channel title"
          }
          if ((Get-SingleChildText $channel 'link') -cne $releaseUrl) {
            throw "Appcast channel link must match the immutable release URL"
          }
          if ((Get-SingleChildText $channel 'description') -cne
              'Stable updates for Focus Browser x64') {
            throw "Unexpected appcast channel description"
          }
          if ((Get-SingleChildText $channel 'language') -cne 'ru') {
            throw "Appcast channel language must be ru"
          }
          if ((Get-SingleChildText $item 'title') -cne
              "Focus Browser $($env:FOCUS_SHORT_VERSION)") {
            throw "Unexpected appcast item title"
          }
          if ((Get-SingleChildText $item 'link') -cne $releaseUrl) {
            throw "Appcast item link must match the immutable release URL"
          }

          $pubDateText = Get-SingleChildText $item 'pubDate'
          $culture = [Globalization.CultureInfo]::InvariantCulture
          $styles = [Globalization.DateTimeStyles]::AllowWhiteSpaces -bor
            [Globalization.DateTimeStyles]::AssumeUniversal -bor
            [Globalization.DateTimeStyles]::AdjustToUniversal
          $pubDate = [DateTimeOffset]::MinValue
          if (-not [DateTimeOffset]::TryParseExact(
              $pubDateText, 'r', $culture, $styles, [ref]$pubDate)) {
            throw "Appcast pubDate must be canonical RFC1123 UTC"
          }
          $canonicalPubDate = $pubDate.UtcDateTime.ToString('r', $culture)
          if ($pubDateText -cne $canonicalPubDate) {
            throw "Appcast pubDate must use canonical RFC1123 GMT formatting"
          }
          $now = [DateTimeOffset]::UtcNow
          if ($pubDate -gt $now.AddMinutes(5)) {
            throw "Appcast pubDate is more than five minutes in the future"
          }
          if ($pubDate -lt $now.AddDays(-7)) {
            throw "Appcast pubDate is older than seven days"
          }

          $asset = @($release.assets |
            Where-Object name -CEQ $env:ASSET_NAME)[0]
          if ([string]$enclosure.url -cne [string]$asset.browser_download_url) {
            throw "Appcast enclosure URL does not match the immutable release asset"
          }
          if ($enclosure.GetAttribute('version', $sparkleNamespace) -cne
              $env:FOCUS_VERSION) {
            throw "Appcast full version mismatch"
          }
          if ($enclosure.GetAttribute('shortVersionString', $sparkleNamespace) -cne
              $env:FOCUS_SHORT_VERSION) {
            throw "Appcast short version mismatch"
          }
          if ($enclosure.GetAttribute('os', $sparkleNamespace) -cne 'windows-x64') {
            throw "Appcast OS must be windows-x64"
          }
          if ([string]$enclosure.type -cne 'application/octet-stream') {
            throw "Unexpected appcast enclosure content type"
          }
          $actualLength = (Get-Item -LiteralPath $env:FOCUS_UPDATE_PAYLOAD).Length
          if ([int64]$enclosure.length -ne $actualLength) {
            throw "Appcast enclosure length mismatch"
          }
          $signature = $enclosure.GetAttribute('edSignature', $sparkleNamespace)
          if ($signature -notmatch '^[A-Za-z0-9+/]{86}==$') {
            throw "Appcast Ed25519 signature is malformed"
          }

          & $env:WINSPARKLE_TOOL verify `
            --public-key $env:WINSPARKLE_ED_KEY `
            --signature $signature `
            $env:FOCUS_UPDATE_PAYLOAD
          if ($LASTEXITCODE -ne 0) {
            throw "WinSparkle signature verification failed"
          }

          $previousPath = Join-Path $env:RUNNER_TEMP 'previous-appcast-x64.xml'
          $previousExists = $false
          try {
            Invoke-WebRequest -UseBasicParsing `
              -Uri $env:PRODUCTION_APPCAST_URL `
              -OutFile $previousPath
            $previousExists = $true
          } catch {
            $statusCode = $_.Exception.Response.StatusCode.value__
            if ($statusCode -ne 404) {
              throw
            }
          }
          if ($previousExists) {
            $previousDocument = Read-SafeXml $previousPath
            $previousEnclosures = @(
              $previousDocument.SelectNodes('/rss/channel/item/enclosure'))
            if ($previousEnclosures.Count -ne 1) {
              throw "Existing production appcast is malformed"
            }
            $previousVersionText = $previousEnclosures[0].GetAttribute(
              'version',
              $sparkleNamespace)
            $previousVersion = [Version]$previousVersionText
            $candidateVersion = [Version]$env:FOCUS_VERSION
            if ($candidateVersion -lt $previousVersion) {
              throw "Refusing to roll the production appcast back"
            }
            if ($candidateVersion -eq $previousVersion) {
              $previousHash = (Get-FileHash -Algorithm SHA256 `
                -LiteralPath $previousPath).Hash
              $candidateHash = (Get-FileHash -Algorithm SHA256 `
                -LiteralPath $env:FOCUS_UPDATE_APPCAST).Hash
              if ($candidateHash -cne $previousHash) {
                throw "Refusing to replace an existing version with different bytes"
              }
            }
          }

          python .github/scripts/stage_public_appcast.py `
            --source "$env:FOCUS_UPDATE_APPCAST" `
            --feed-name appcast-x64.xml `
            --destination-dir "$siteRoot"
          if ($LASTEXITCODE -ne 0) {
            throw "Shared x64 appcast staging gate failed"
          }

          $previousMacExists = $false
          try {
            $macResponse = Invoke-WebRequest -UseBasicParsing -Method Head `
              -Uri $env:PRODUCTION_MACOS_APPCAST_URL
            if ([int]$macResponse.StatusCode -ne 200) {
              throw "Unexpected success status for the production macOS appcast"
            }
            $previousMacExists = $true
          } catch {
            $failureResponse = $_.Exception.Response
            if ($null -eq $failureResponse -or
                [int]$failureResponse.StatusCode -ne 404) {
              throw
            }
          }
          if ($previousMacExists) {
            throw "A production macOS appcast exists; use a future coordinated cross-platform Pages workflow that cryptographically revalidates and preserves both channels"
          }
          [IO.File]::WriteAllText(
            (Join-Path $siteRoot '.nojekyll'),
            '',
            [Text.UTF8Encoding]::new($false))
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/focus-pages
          include-hidden-files: true

  deploy-appcast:
    name: Deploy production appcast
    needs: verify-appcast
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
