<style include="cr-shared-style settings-shared action-link">
  .command-row {
    align-items: center;
    gap: 16px;
    min-height: var(--cr-section-two-line-min-height);
  }

  .command-details {
    flex: 1;
    min-width: 0;
    padding-bottom: var(--cr-section-vertical-padding);
    padding-top: var(--cr-section-vertical-padding);
  }

  .command-name {
    line-height: 20px;
  }

  .shortcut-list {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }

  .shortcut-chip {
    align-items: center;
    background: var(--cr-hover-background-color);
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--cr-primary-text-color);
    display: inline-flex;
    font-size: 12px;
    font-weight: 500;
    line-height: 20px;
    min-height: 28px;
    overflow: hidden;
    padding-inline-end: 2px;
    padding-inline-start: 10px;
    white-space: nowrap;
  }

  .shortcut-chip[locked] {
    color: var(--cr-form-field-label-color);
    padding-inline-end: 10px;
  }

  .shortcut-label {
    align-items: center;
    display: inline-flex;
    height: 24px;
    line-height: 24px;
  }

  .shortcut-chip cr-icon-button {
    --cr-icon-button-icon-size: 16px;
    --cr-icon-button-margin-end: 0;
    --cr-icon-button-margin-start: 0;
    --cr-icon-button-size: 24px;
    flex-shrink: 0;
    margin-inline-start: 4px;
  }

  .actions {
    align-items: center;
    display: flex;
    flex-shrink: 0;
    gap: 8px;
  }

  .actions cr-button {
    --cr-button-height: 32px;
  }

  #macSystemShortcutsNotice {
    background: var(--cr-hover-background-color);
    border-radius: 8px;
    line-height: 20px;
    margin: 0 var(--cr-section-padding) 12px;
    min-height: 0;
    padding: 12px 16px;
  }

  #noResults {
    min-height: var(--cr-section-min-height);
  }

  .loading-block {
    background: var(--cr-hover-background-color);
    box-sizing: border-box;
    border-radius: 8px;
  }

  .loading-name {
    height: 20px;
    width: min(220px, 55%);
  }

  .loading-shortcuts {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }

  .loading-chip {
    height: 30px;
    width: 64px;
  }

  .loading-action {
    border-radius: 8px;
    height: 32px;
    width: 66px;
  }

  #captureTarget {
    align-items: center;
    background: var(--cr-hover-background-color);
    border: 1px solid var(--cr-separator-color);
    border-radius: 8px;
    color: var(--cr-primary-text-color);
    display: flex;
    font-weight: 500;
    justify-content: center;
    min-height: 56px;
    padding: 12px 16px;
  }

  #captureTarget:focus {
    box-shadow: inset 0 0 0 2px var(--cr-focus-outline-color);
    outline: none;
  }

  .warning {
    color: var(--google-red-700);
    margin-top: 12px;
  }

  @media (max-width: 700px) {
    .command-row {
      align-items: stretch;
      flex-direction: column;
    }

    .separator {
      display: none;
    }

    .actions {
      justify-content: flex-end;
      padding-bottom: var(--cr-section-vertical-padding);
    }
  }
</style>

<settings-subpage page-title="$i18n{shortcutsPageTitle}"
    route-path$="[[routePath]]"
    search-label="$i18n{shortcutsSearchLabel}"
    search-icon="settings20:filter-list"
    search-term="{{searchTerm_}}">
  <cr-button id="resetAllButton" class="secondary-button"
      slot="subpage-title-extra" disabled="[[!hasModifiedCommands_]]"
      on-click="onResetAllClick_">
    $i18n{shortcutsResetAll}
  </cr-button>

  <if expr="is_macosx">
    <div id="macSystemShortcutsNotice" class="secondary">
      <span>
        $i18n{shortcutsMacSystemSettingsNotice}
        <a is="action-link" on-click="onMacSystemShortcutsLinkClick_">
          $i18n{shortcutsMacSystemSettingsLink}
        </a>.
      </span>
    </div>
  </if>

  <template is="dom-if" if="[[!commandsLoaded_]]">
    <template is="dom-repeat" items="[[loadingRows_]]">
      <div class="cr-row command-row">
        <div class="command-details cr-padded-text">
          <div class="loading-block loading-name"></div>
          <div class="loading-shortcuts">
            <div class="loading-block loading-chip"></div>
            <div class="loading-block loading-chip"></div>
          </div>
        </div>
        <div class="separator"></div>
        <div class="actions">
          <div class="loading-block loading-action"></div>
        </div>
      </div>
    </template>
  </template>

  <template is="dom-repeat" items="[[filteredCommands_]]" as="command">
    <div class="cr-row command-row">
      <div class="command-details cr-padded-text">
        <div class="command-name">[[command.name]]</div>
        <div class="shortcut-list secondary">
          <template is="dom-repeat" items="[[command.accelerators]]"
              as="accelerator">
            <span class="shortcut-chip"
                locked$="[[!accelerator.userModifiable]]">
              <span class="shortcut-label">[[accelerator.displayText]]</span>
              <template is="dom-if" if="[[accelerator.userModifiable]]">
                <cr-icon-button class="icon-clear"
                    title="$i18n{remove}"
                    data-command-id$="[[command.commandId]]"
                    data-serialized-accelerator$="[[accelerator.serializedAccelerator]]"
                    aria-label$="[[getRemoveLabel_(command.name,
                        accelerator.displayText)]]"
                    on-click="onRemoveShortcutClick_">
                </cr-icon-button>
              </template>
            </span>
          </template>
        </div>
      </div>
      <div class="separator"></div>
      <div class="actions">
        <cr-button data-command-id$="[[command.commandId]]"
            on-click="onAddShortcutClick_">
          $i18n{add}
        </cr-button>
        <template is="dom-if" if="[[command.modified]]">
          <cr-button data-command-id$="[[command.commandId]]"
              on-click="onResetCommandClick_">
            $i18n{shortcutsReset}
          </cr-button>
        </template>
      </div>
    </div>
  </template>

  <template is="dom-if"
      if="[[showNoResults_(commandsLoaded_, filteredCommands_.length)]]">
    <div id="noResults" class="cr-row secondary">
      $i18n{searchNoResults}
    </div>
  </template>

  <template is="dom-if" if="[[showCaptureDialog_]]" restamp>
    <cr-dialog id="captureDialog" show-on-attach>
      <div slot="title">$i18n{shortcutsAddDialogTitle}</div>
      <div slot="body">
        <div id="captureTarget" tabindex="0" on-keydown="onCaptureKeyDown_">
          [[getCapturedDisplayText_(capturedDisplayText_)]]
        </div>
        <template is="dom-if" if="[[captureMessage_]]">
          <div class="warning">[[captureMessage_]]</div>
        </template>
      </div>
      <div slot="button-container">
        <cr-button class="cancel-button" on-click="onCancelDialogClick_">
          $i18n{cancel}
        </cr-button>
        <cr-button class="action-button" disabled="[[!canSaveCaptured_]]"
            on-click="onSaveShortcutClick_">
          $i18n{save}
        </cr-button>
      </div>
    </cr-dialog>
  </template>
  <template is="dom-if" if="[[showResetDialog_]]" restamp>
    <cr-dialog id="resetDialog" show-on-attach>
      <div slot="title">$i18n{shortcutsResetDialogTitle}</div>
      <div slot="body">$i18n{shortcutsResetDialogDescription}</div>
      <div slot="button-container">
        <cr-button class="cancel-button" on-click="onCancelDialogClick_">
          $i18n{cancel}
        </cr-button>
        <cr-button class="action-button" on-click="onResetDialogConfirm_">
          $i18n{shortcutsReset}
        </cr-button>
      </div>
    </cr-dialog>
  </template>
</settings-subpage>
